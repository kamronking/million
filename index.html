<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Миллион"><meta name="theme-color" content="#17704f">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style><title>Мой план</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first column — today's 3 tasks on top, the goal, then nine 3x3 blocks stacked (central block first) */
:root{
  --bg:#eef1ed; --card:#ffffff; --fg:#141a17; --muted:#5a665f; --line:#d5dcd6;
  --accent:#17704f; --accent-soft:#e2f2ea; --done:#17704f; --done-fg:#ffffff; --hi:#c8f169; --hi-fg:#141a17;
  --display:'Unbounded','Onest',system-ui,sans-serif; --body:'Onest',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1412;--card:#18201c;--fg:#e8eee9;--muted:#9fb0a6;--line:#2b3631;--accent:#5fc49b;--accent-soft:#1d3329;--done:#2f8f68;--done-fg:#ffffff;--hi:#c8f169;--hi-fg:#141a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1412;--card:#18201c;--fg:#e8eee9;--muted:#9fb0a6;--line:#2b3631;--accent:#5fc49b;--accent-soft:#1d3329;--done:#2f8f68;--done-fg:#ffffff;--hi:#c8f169;--hi-fg:#141a17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,6.5vw,32px);letter-spacing:-.5px;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.3px;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.today{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--bg);cursor:pointer;border:1.5px solid transparent}
.task input{width:24px;height:24px;flex:none;accent-color:var(--done);margin:1px 0 0}
.task .t{font-weight:600}
.task .m{font-size:13px;color:var(--muted);margin-top:2px}
.task.on .t{text-decoration:line-through;color:var(--muted)}
.goal{background:var(--accent);color:#fff;border-radius:22px;padding:20px}
.goal .eyebrow{color:var(--hi)}
.goal p{margin:8px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(17px,4.6vw,21px);line-height:1.3}
.prog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;font-weight:600}
.prog .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--hi);border-radius:99px}
.block{display:flex;flex-direction:column;gap:8px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bh span{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{min-height:96px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:8px;font-size:12.5px;line-height:1.3;font-weight:500;color:var(--fg);text-align:left;font-family:var(--body);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0;word-break:break-word}
.cell .ck{font-size:11px;font-weight:700;color:var(--muted)}
.cell.on{background:var(--done);color:var(--done-fg);border-color:var(--done)}
.cell.on .ck{color:var(--done-fg)}
.cell.mid{background:var(--accent-soft);border-color:var(--accent);font-family:var(--display);font-weight:600;font-size:12px;cursor:default;justify-content:center;text-align:center}
.cell.core{background:var(--accent);color:#fff;border-color:var(--accent)}
.cell.dir{background:var(--accent-soft);border-color:var(--line);font-weight:700;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--hi);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:0}
.reset{align-self:flex-start;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:10px 14px;font:600 13px var(--body);cursor:pointer}
@media (max-width:360px){.cell{font-size:11.5px;min-height:104px}}
</style>

<div id="lock"><div class="lk"><div class="lic">1M</div><div class="eyebrow">Личный план</div><h1 style="font-size:24px">Введи PIN-код</h1>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><p class="hint" id="lmsg">&nbsp;</p>
<div class="pad" id="pad"></div></div></div>
<style>#lock{min-height:80vh;display:flex;align-items:center;justify-content:center}.lk{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:300px}
.lic{width:64px;height:64px;border-radius:18px;background:#17704f;color:#c8f169;font:800 24px var(--display);display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:16px;margin:6px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}.dots i.f{background:var(--accent)}.dots.err{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}.pad button{height:64px;border-radius:50%;aspect-ratio:1;justify-self:center;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:600 24px var(--body);cursor:pointer}.pad button:active{background:var(--accent-soft)}.pad .x{border:none;background:none;font-size:16px}
.lockbtn{align-self:flex-start;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:10px 14px;font:600 13px var(--body);cursor:pointer}</style>

async function open(pin){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},k,u(P.c))))}
